<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLCSS Bootstrap Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
        integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- /Fontawesome -->
    <link rel="stylesheet" href="./styles/index.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="./index.html">
                    <img class="navbar-logo" src="./imgs/duck.png" alt="Website Logo Image">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="./index.html">Catalogo Libri</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Anagrafica Utenti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-disabled="true">Storico Prestiti</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-disabled="true">Help</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input id="searchBar" class="search-bar form-control me-2 bg-white text-black" type="search"
                            placeholder="Cerca..." aria-label="Search" />
                        <button class="btn btn-outline-light" type="submit">Cerca</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <form class="container my-5" action="URL" method="post">
            <div class="row my-4">
                <div class="col-12">
                    <div class="h2">Nuovo Libro</div>
                </div>
            </div>
            <div class="row my-2">
                <div class="col-6">
                    <label class="form-label" for="nomeAutore">Nome Autore</label>
                    <input required type="text" class="form-control" id="nomeAutore" name="nomeAutore"
                        placeholder="Inserisci il nome dell'autore">
                </div>
                <div class="col-6">
                    <label class="form-label" for="cognomeAutore">Cognome Autore</label>
                    <input required type="text" class="form-control" id="cognomeAutore" name="cognomeAutore"
                        placeholder="Inserisci il cognome dell'autore">
                </div>
            </div>
            <div class="row my-2">
                <div class="col-12">
                    <label class="form-label" for="titoloLibro">Titolo</label>
                    <input required type="text" class="form-control" id="titoloLibro" name="titoloLibro"
                        placeholder="Inserisci il titolo del libro" aria-describedby="titoloHelp">
                    <div id="titoloHelp" class="form-text">
                        Titolo della versione italiana.
                    </div>
                </div>
            </div>
            </div>
            <div class="row my-2">
                <div class="col-12 col-lg-4 my-2">
                    <label class="form-label" aria-label="Genere" for="genereSelect">Genere</label>
                    <select required class="form-select" aria-label="Seleziona il genere" id="genereSelect">
                        <option selected disabled value>Scegli il genere</option>
                        <option value="horror">Horror</option>
                        <option value="sci-fi">Fantascienza</option>
                        <option value="fantasy">Fantasy</option>
                    </select>
                </div>
                <div class="col-12 col-lg-4 my-2">
                    <label class="form-label" aria-label="Anno di pubblicazione" for="annoPubblicazione">Anno di Pubblicazione</label>
                    <input required class="form-control" type="number" placeholder="Inserisci l'anno" id="annoPubblicazione" min="1500" max="2026" aria-describedby="annoHelp">
                    <div id="annoHelp" class="form-text">
                        Anno di pubblicazione in Italia, si accettano solo anni a partire dal 1500 fino ad oggi.
                    </div>
                </div>
                <div class="col-12 col-lg-4 my-2">
                    <label class="form-label" aria-label="Codice ISBN#" for="isbn">ISBN#</label>
                    <input class="form-control" type="text" placeholder="Inserisci il codice ISBN#" id="isbn" aria-describedby="isbnHelp" required>
                    <div id="isbnHelp" class="form-text">
                        Il codice ISBN# si trova spesso stampato sul retro dei libri.
                    </div>
                </div>
            </div>
            <hr class="my-4">
            <div class="row my-2">
                <div class="col-12">
                    <label class="form-label" for="note">Note</label>
                    <textarea class="area-note form-control" name="Note" id="note" placeholder="Inserisci eventuali note sul libro"></textarea>
                </div>
            </div>
            <div class="row my-2">
                <div class="col-12 my-2">
                    <input type="checkbox" name="digitale" id="digitale" class="form-check-input" aria-label="Disponibile in digitale?">
                    <label class="form-check-label" for="digitale">Disponibile anche in digitale</label>
                </div>
                <div class="col-12 my-2">
                    <button type="submit" class="btn btn-primary">Aggiungi Libro</button>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
